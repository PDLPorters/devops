name: Install DuckDB
runs:
  using: "composite"
  steps:
    - name: Install DuckDB (Linux libduckdb)
      shell: bash
      if: runner.os == 'Linux'
      run: |
        echo "::group::Install DuckDB (Linux libduckdb)"
        curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.2.1/libduckdb-linux-amd64.zip -o /tmp/libduckdb.zip
        unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
        sudo cp /tmp/libduckdb/duckdb.h /usr/local/include/
        sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
        sudo ldconfig
        echo "::endgroup::"
    - name: Install DuckDB (via brew)
      shell: bash
      if: runner.os == 'macOS'
      run: |
        echo "::group::Install DuckDB (via brew)"
        brew install duckdb
        echo "::endgroup::"
    - name: Install DuckDB (via vcpkg)
      shell: bash
      if: runner.os == 'Windows'
      run: |
        echo "::group::Install DuckDB (via vcpkg)"
        vcpkg install duckdb:x64-windows
        VCPKG_PREFIX="$(cygpath -w "$VCPKG_INSTALLATION_ROOT")\\installed\\x64-windows"
        echo "PKG_CONFIG_PATH=${VCPKG_PREFIX}\\lib\\pkgconfig" >> "$GITHUB_ENV"
        echo "${VCPKG_PREFIX}\\bin" >> "$GITHUB_PATH"
        echo "::endgroup::"
